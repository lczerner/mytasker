# Dependency updates. Security updates are separate (repository settings:
# Dependabot alerts and Dependabot security updates, both on).
#
# oplog-core is a local link (file:../oplog-core, pinned in .oplog-core-ref). Dependabot does not
# update it; its own repository has its own Dependabot configuration.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Prague
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    ignore:
      - dependency-name: oplog-core
    groups:
      # Build and test tools: 1 PR for all minor and patch updates.
      # Major updates of dev tools come as separate PRs.
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    # preact is a runtime dependency (it ships inside app/index.html). It is not in a group, so it
    # always gets its own PR. Its PR must also update THIRD-PARTY-NOTICES.md (the build check and
    # the SBOM check fail without it).

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Prague
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
